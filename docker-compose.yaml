volumes:
  var_asterisk_data:
  etc_data:
  logs_asterisk_data:
  www_data:
  fail2ban_data:

networks:
  defaultnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: freepbxint
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

secrets:
  freepbxuser_password:
    file: secrets/freepbxuser_password.txt

services:
  freepbx:
    build: 
      context: ./source
      dockerfile: Dockerfile
    image: ontaxi-freepbx:latest
    restart: always
    environment:
      DBHOST: ontaxivoipmysql0.mysql.database.azure.com
      DBUSER: asterisk
      DBPORT: 3306
    volumes:
      - var_asterisk_data:/var/lib/asterisk
      - etc_data:/etc
      - logs_asterisk_data:/var/log/asterisk
      - www_data:/var/www/html
      - ./records:/var/spool/asterisk/monitor
    networks:
      defaultnet:
        ipv4_address: 172.18.0.20
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "5038:5038/tcp"
      - "5060:5060/udp"
      - "8088:8088/tcp"
    secrets:
      - freepbxuser_password
    ulimits:
      core:
        soft: -1
        hard: -1
      memlock:
        soft: -1
        hard: -1

  fail2ban:
    restart: unless-stopped
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PUID: 1000
      PGID: 2000
      TZ: UTC
    volumes:
      - fail2ban_data:/remotelogs/freepbx:ro
      - ./source/fail2ban/jail.local:/config/fail2ban/jail.local
      - ./source/fail2ban/filter.d/asterisk.conf:/config/fail2ban/filter.d/asterisk.conf
    depends_on:
      - freepbx