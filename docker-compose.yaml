volumes:
  var_data:
  etc_data:

networks:
  defaultnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: freepbxint
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

secrets:
  freepbxuser_password:
    file: secrets/freepbxuser_password.txt

services:
  freepbx:
    restart: always
    image: escomputers/freepbx:17-nofail2ban
    environment:
      DBHOST: ontaxivoipmysql0.mysql.database.azure.com
      DBUSER: asterisk
      DBPORT: 3306
    volumes:
      - var_data:/var
      - etc_data:/etc
    networks:
      defaultnet:
        ipv4_address: 172.18.0.20
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "5060:5060/udp"
    secrets:
      - freepbxuser_password

  fail2ban:
    restart: unless-stopped
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PUID: 1000
      PGID: 2000
      TZ: UTC
    volumes:
      - var_data:/remotelogs/freepbx:ro
      - ./source/fail2ban/jail.local:/config/fail2ban/jail.local
      - ./source/fail2ban/filter.d/asterisk.conf:/config/fail2ban/filter.d/asterisk.conf
    depends_on:
      - freepbx